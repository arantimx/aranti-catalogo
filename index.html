<title>Catálogo Arānti — Otoño 26'</title>
<meta name="description" content="Productos extraordinarios para tu mesa. Vajillas, cristalería, cubiertos y complementos.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f7f3ee;--cream-dark:#ede7dc;--teal:#0d3d4a;--teal-light:#1a5568;
  --copper:#b8935a;--copper-light:#d4aa78;--text:#2c2420;--muted:#8a7f75;--wa:#25d366;
}
html{scroll-behavior:smooth;scroll-padding-top:116px}
body{background:var(--cream-dark);color:var(--text);font-family:'Jost',system-ui,sans-serif;font-weight:300;overflow-x:hidden}

.top{position:fixed;top:0;left:0;right:0;z-index:100}
header{
  background:var(--cream);border-bottom:1px solid var(--cream-dark);
  height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;
}
.logo-wrap{display:flex;align-items:center;gap:14px;text-decoration:none}
.logo-icon{width:34px;height:34px;flex-shrink:0}
.logo-text{display:flex;flex-direction:column;gap:1px}
.logo-name{font-weight:200;font-size:17px;letter-spacing:.35em;color:var(--teal);text-transform:uppercase}
.logo-season{font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.header-actions{display:flex;align-items:center;gap:10px}
.btn-wa{
  display:flex;align-items:center;gap:7px;background:var(--wa);color:#fff;
  padding:9px 18px;border-radius:2px;font-size:12px;letter-spacing:.08em;
  text-decoration:none;white-space:nowrap;font-family:inherit;
}
.btn-wa svg{width:15px;height:15px;fill:#fff;flex-shrink:0}
.btn-dl{
  display:flex;align-items:center;gap:6px;border:1px solid var(--cream-dark);
  padding:8px 14px;border-radius:2px;font-size:12px;color:var(--muted);
  text-decoration:none;font-family:inherit;letter-spacing:.05em;
}
.btn-dl:hover{border-color:var(--copper);color:var(--copper)}

.sections-nav{
  background:var(--teal);display:flex;overflow-x:auto;padding:0 32px;
  scrollbar-width:none;border-bottom:1px solid var(--teal-light);
}
.sections-nav::-webkit-scrollbar{display:none}
.snav-btn{
  padding:14px 20px;font-family:inherit;font-size:11px;font-weight:300;
  letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.55);
  border-bottom:2px solid transparent;text-decoration:none;
  white-space:nowrap;transition:color .2s,border-color .2s;
}
.snav-btn:hover{color:rgba(255,255,255,.9)}
.snav-btn.active{color:var(--copper-light);border-bottom-color:var(--copper-light)}

main{padding:140px 20px 110px;display:flex;flex-direction:column;align-items:center;gap:18px}
.page{
  width:100%;max-width:560px;background:#fff;
  box-shadow:0 8px 40px rgba(44,36,32,.12);position:relative;
}
.page img{display:block;width:100%;height:auto}
.page::before{
  content:"";position:absolute;top:50%;left:50%;width:24px;height:24px;margin:-12px;
  border:1.5px solid var(--cream-dark);border-top-color:var(--copper);border-radius:50%;
  animation:spin .9s linear infinite;z-index:0;
}
.page img{position:relative;z-index:1}
.page.loaded::before{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.counter{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--teal);border-radius:2px;padding:10px 20px;z-index:50;
  display:flex;align-items:center;gap:16px;box-shadow:0 4px 24px rgba(13,61,74,.3);
}
.counter button{background:none;border:none;color:rgba(255,255,255,.65);cursor:pointer;font-size:16px;padding:2px 8px;font-family:inherit}
.counter button:hover{color:var(--copper-light)}
.page-info{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.6);min-width:64px;text-align:center}

.wa-float{
  position:fixed;bottom:90px;right:24px;background:var(--wa);
  width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(37,211,102,.35);z-index:60;
}
.wa-float svg{width:24px;height:24px;fill:#fff}

footer{
  background:var(--teal);padding:28px 32px 90px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;
}
.footer-logo{font-weight:200;font-size:16px;letter-spacing:.35em;color:rgba(255,255,255,.75);text-transform:uppercase}
.footer-links{display:flex;flex-wrap:wrap;gap:20px;font-size:11px;letter-spacing:.08em}
.footer-links a{color:rgba(255,255,255,.5);text-decoration:none}
.footer-links a:hover{color:var(--copper-light)}

@media(max-width:768px){
  html{scroll-padding-top:104px}
  header{padding:0 16px;height:56px}
  .logo-name{font-size:15px;letter-spacing:.25em}
  .sections-nav{padding:0 8px}
  .snav-btn{padding:12px 13px;font-size:10px;letter-spacing:.1em}
  main{padding:118px 10px 100px;gap:12px}
  .counter{bottom:18px;padding:8px 14px;gap:10px}
  .wa-float{bottom:80px;right:16px}
  footer{padding:20px 16px 90px}
  .btn-wa span{display:none}
  .btn-wa{padding:9px 12px}
}
</style>
</head>
<body>

<script>
// Estos valores los llena build.py al publicar (no editar aquí; las secciones van en secciones.json)
/*CONFIG*/
const TOTAL = 131;
const CARPETA = 'paginas-otono26';
const ANCHO = 903, ALTO = 1650;
const SECCIONES = [{"id":"inicio","nombre":"Catálogo","pagina":1}];
/*FIN CONFIG*/

const nav = document.getElementById('nav');
SECCIONES.forEach((s,i) => {
  const a = document.createElement('a');
  a.className = 'snav-btn' + (i === 0 ? ' active' : '');
  a.href = '#' + s.id; a.dataset.page = s.pagina; a.textContent = s.nombre;
  nav.appendChild(a);
});

const main = document.getElementById('pages');
const info = document.getElementById('page-info');
const navBtns = [...nav.querySelectorAll('.snav-btn')];
const ids = Object.fromEntries(SECCIONES.map(s=>[s.pagina, s.id]));
let current = 1;

for (let i = 1; i <= TOTAL; i++) {
  const n = String(i).padStart(3,'0');
  const fig = document.createElement('figure');
  fig.className = 'page';
  fig.dataset.page = i;
  fig.id = ids[i] || 'p' + i;
  const img = new Image();
  img.width = ANCHO; img.height = ALTO;
  img.alt = 'Catálogo Arānti, página ' + i;
  img.decoding = 'async';
  img.loading = i <= 2 ? 'eager' : 'lazy';
  img.onload = () => fig.classList.add('loaded');
  img.onerror = () => { setTimeout(() => { img.src = img.src.split('?')[0] + '?r=' + Date.now(); }, 1500); };
  img.src = CARPETA + '/' + n + '.webp';
  fig.appendChild(img);
  main.appendChild(fig);
}

const pages = [...main.children];
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) setCurrent(+e.target.dataset.page); });
}, {rootMargin: '-45% 0px -50% 0px'});
pages.forEach(p => io.observe(p));

function setCurrent(n) {
  current = n;
  info.textContent = n + ' / ' + TOTAL;
  let active = 0;
  navBtns.forEach((b,i) => { if (n >= +b.dataset.page) active = i; });
  navBtns.forEach((b,i) => b.classList.toggle('active', i === active));
  const a = navBtns[active];
  if (a.offsetLeft < nav.scrollLeft || a.offsetLeft + a.offsetWidth > nav.scrollLeft + nav.clientWidth) {
    nav.scrollTo({left: a.offsetLeft - 16, behavior: 'smooth'});
  }
}

function step(d) {
  const t = Math.min(TOTAL, Math.max(1, current + d));
  pages[t-1].scrollIntoView({behavior: 'smooth'});
}

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});

// Abre directo en una sección o página: catalogo.aranti.mx/#vajillas o /#p40
if (location.hash) {
  const t = document.getElementById(location.hash.slice(1));
  if (t) requestAnimationFrame(() => t.scrollIntoView());
}
</script>
